[project]
name = "parkingradio"
version = "0.1.0"
description = "Tools that automate operating Parking Radio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 8.2 is the first where a group without a command shows its help on stderr and exits with 2.
    "click>=8.2",
    # The oldest versions that the tests pass with (checked on Python 3.13).
    "filelock>=3.10",
    "httpx>=0.24",
    "keyring>=23",
]

[project.scripts]
parkingradio = "parkingradio.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Including what fails in another thread, e.g. the fake browser's.
filterwarnings = ["error"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
