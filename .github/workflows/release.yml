#
# Release the tool when a version's tag, e.g. v0.2.0, is pushed: check that it's the version in pyproject.toml, on main,
# lint and test as CI does, build, publish to PyPI once a maintainer approves, and create the tag's GitHub Release.
#
# Its actions are pinned by SHA, since what it builds is what's published. test.yml, which it calls, has its own.
#

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For origin/main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - id: version
        run: |
          version=$(uv version --short)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the version in pyproject.toml is $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main: tag the commit that the version's PR was merged as"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv build
      # The tests run the checkout: check that what's published installs on its own, and runs.
      - run: uvx --isolated --from dist/*.whl parkingradio --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Whose required reviewer approves publishing.
    environment:
      name: pypi
      url: https://pypi.org/project/parkingradio/${{ needs.build.outputs.version }}/
    permissions:
      # For trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
